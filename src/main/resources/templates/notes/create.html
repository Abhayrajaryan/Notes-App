<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Note</title>
    <th:block th:replace="~{fragments/theme-toggle :: themeInit}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="notes-app">
    <div class="editor-topbar">
        <a href="/notes" class="btn-cancel">Cancel</a>
        <div class="header-actions">
            <th:block th:replace="~{fragments/theme-toggle :: themeToggle}"></th:block>
        </div>
    </div>

    <div class="note-form">
        <form th:action="@{/notes}" method="post" th:object="${note}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" placeholder="Title" autofocus />
                <span th:errors="*{title}" class="error-message">Title is required</span>
            </div>

            <div class="form-divider"></div>

            <div class="form-group">
                <label for="mainContent">Content</label>
                <textarea id="mainContent" th:field="*{mainContent}" rows="10" placeholder="Start writing…"></textarea>
                <span th:errors="*{mainContent}" class="error-message">Main content is required</span>
            </div>

            <button type="submit" class="btn-save">Save Note</button>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/theme-toggle :: themeScript}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="notes-app">
        <div class="notes-header">
            <h1>Notes</h1>
            <a href="/notes/new" class="btn-new-note">New Note</a>
        </div>

        <div class="notes-search">
            <input type="text" id="searchInput" placeholder="Search notes..." />
        </div>

        <div class="notes-list">
            <ul>
                <li th:each="note : ${notes}">
                    <div class="note-item">
                        <h3 th:text="${note.title}" class="note-title"></h3>
                        <p th:text="${note.mainContent}" class="note-preview"></p>
                        <div class="note-actions">
                            <a th:href="@{/notes/{id}(id=${note.id})}" class="note-action view">View</a>
                            <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="note-action edit">Edit</a>
                            <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" style="display:inline">
                                <button type="submit" class="note-action delete">Delete</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
            <div th:if="${notes.empty}" class="empty-state">No notes found. Create your first note!</div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Note</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="notes-app">
        <div class="notes-header">
            <h1>Edit Note</h1>
            <a href="/notes" class="btn-back">Back to Notes</a>
        </div>

        <div class="note-form">
            <form th:action="@{/notes/{id}(id=${note.id})}" method="post" th:object="${note}">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" />
                    <span th:errors="*{title}" class="error-message">Title is required</span>
                </div>

                <div class="form-group">
                    <label for="mainContent">Content</label>
                    <textarea id="mainContent" th:field="*{mainContent}" rows="5"></textarea>
                    <span th:errors="*{mainContent}" class="error-message">Main content is required</span>
                </div>

                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>

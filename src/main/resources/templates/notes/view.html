<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${note.title}">Note</title>
    <th:block th:replace="~{fragments/theme-toggle :: themeInit}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="notes-app">
    <div class="editor-topbar">
        <a href="/notes" class="btn-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Notes
        </a>
        <div class="header-actions">
            <th:block th:replace="~{fragments/theme-toggle :: themeToggle}"></th:block>
            <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="header-icon-btn" aria-label="Edit note" title="Edit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </a>
            <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" class="inline-form" onsubmit="return confirm('Delete this note? This cannot be undone.');">
                <button type="submit" class="header-icon-btn" aria-label="Delete note" title="Delete" style="color: var(--danger);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                </button>
            </form>
        </div>
    </div>

    <div class="note-view-panel">
        <h1 th:text="${note.title}">Note Title</h1>
        <p class="note-view-date" th:text="${'Edited ' + #temporals.format(note.updatedOn, 'MMM d, yyyy ''at'' h:mm a')}">Edited Jan 1, 2026 at 12:00 PM</p>
        <p class="note-preview" th:text="${note.mainContent}">Note content goes here.</p>
    </div>
</div>

<th:block th:replace="~{fragments/theme-toggle :: themeScript}"></th:block>
</body>
</html>

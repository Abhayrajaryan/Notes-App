<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note Not Found</title>
    <th:block th:replace="~{fragments/theme-toggle :: themeInit}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="notes-app">
    <div class="editor-topbar" style="justify-content: flex-end;">
        <div class="header-actions">
            <th:block th:replace="~{fragments/theme-toggle :: themeToggle}"></th:block>
        </div>
    </div>
    <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
        <h2>Note Not Found</h2>
        <p>The note you're looking for doesn't exist or may have been deleted.</p>
        <a href="/notes" class="btn-cancel" style="display:inline-block; margin-top:1rem;">Back to Notes</a>
    </div>
</div>

<th:block th:replace="~{fragments/theme-toggle :: themeScript}"></th:block>
</body>
</html>
